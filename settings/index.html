<!DOCTYPE html>
<html>
<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; }
    label { display: block; margin: 16px 0 6px; }
    input { box-sizing: border-box; width: 100%; padding: 10px; }
    button { margin-top: 18px; }
    .hint { color: #666; line-height: 1.45; }
    #status { margin-top: 12px; }
    #link-instructions { line-height: 1.45; }
    .connection-status {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr);
      column-gap: 11px;
      row-gap: 3px;
      margin: 18px 0;
      padding: 15px 16px;
      border: 1px solid #34445a;
      border-radius: 12px;
      background-color: #172233 !important;
      color: #f2f6fc !important;
      box-shadow: 0 5px 18px rgba(0, 0, 0, .18);
    }
    .connection-status strong { display: block; color: #fff !important; font-weight: 600; }
    .connection-status small { display: block; margin-top: 4px; line-height: 1.45; color: #c3cfdd !important; }
    .connection-status::before {
      content: '';
      grid-column: 1;
      grid-row: 1 / span 2;
      width: 10px;
      height: 10px;
      margin-top: 5px;
      border-radius: 50%;
      background: #8b98aa;
      box-shadow: 0 0 0 4px rgba(139, 152, 170, .14);
    }
    .connection-status.connected { background-color: #142c25 !important; border-color: #28664f; }
    .connection-status.connected::before { background: #36d991; box-shadow: 0 0 0 4px rgba(54, 217, 145, .16); }
    .connection-status.connecting, .connection-status.reconnecting { background-color: #2a271b !important; border-color: #78632b; }
    .connection-status.connecting::before, .connection-status.reconnecting::before { background: #ffd166; box-shadow: 0 0 0 4px rgba(255, 209, 102, .16); }
    .connection-status.disconnected, .connection-status.unauthorized { background-color: #301f25 !important; border-color: #84404d; }
    .connection-status.disconnected::before, .connection-status.unauthorized::before { background: #ff7183; box-shadow: 0 0 0 4px rgba(255, 113, 131, .16); }
    .connection-status.not_configured, .connection-status.status_unavailable { background-color: #202938 !important; }
    #diagnose { margin-top: 10px; }
    #diagnosis-result { padding: 12px; margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 8px; background: #202938; color: #e4ebf4; line-height: 1.45; }
  </style>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title" data-i18n="settings.title">Hue Bridge-verbinding</h1>
    <p class="homey-subtitle" data-i18n="settings.subtitle">Vul de Bridgegegevens in om de Tap Dial te gebruiken.</p>
  </header>
  <section id="connection-status" class="connection-status" aria-live="polite">
    <strong id="connection-label">Status controleren…</strong>
    <small id="connection-detail"></small>
  </section>
  <div class="homey-form-group">
    <label class="homey-form-label" for="bridge_ip" data-i18n="settings.bridge_ip">IP-adres Hue Bridge</label>
    <input class="homey-form-input" id="bridge_ip" type="text" placeholder="192.168.1.10" />
  </div>
  <button id="connect" class="homey-button-primary-full" data-i18n="settings.connect">Verbinden</button>
  <button id="diagnose" class="homey-button-secondary-full" data-i18n="settings.diagnose">Detectie controleren</button>
  <pre id="diagnosis-result" hidden role="status"></pre>
  <div id="link-step" hidden>
    <p id="link-instructions" data-i18n="settings.press_link_button">Druk nu op de ronde linkknop op de Hue Bridge. De app controleert automatisch of de Bridge de druk heeft gezien.</p>
    <button id="cancel-link" class="homey-button-secondary-full" data-i18n="settings.cancel">Annuleren</button>
  </div>
  <p id="status" role="status"></p>
  <script>
    function onHomeyReady(Homey) {
      const ip = document.getElementById('bridge_ip');
      const status = document.getElementById('status');
      const connect = document.getElementById('connect');
      const linkStep = document.getElementById('link-step');
      const cancelLink = document.getElementById('cancel-link');
      const connectionStatus = document.getElementById('connection-status');
      const connectionLabel = document.getElementById('connection-label');
      const connectionDetail = document.getElementById('connection-detail');
      const diagnose = document.getElementById('diagnose');
      const diagnosisResult = document.getElementById('diagnosis-result');
      let cancelled = false;
      let connecting = false;
      const refreshConnectionStatus = () => {
        Homey.api('GET', '/connection-status', {}, (error, result) => {
          const state = !error && result && result.status ? result.status : 'status_unavailable';
          connectionStatus.className = `connection-status ${state}`;
          connectionLabel.textContent = Homey.__(`settings.connection_${state}`);
          connectionDetail.textContent = Homey.__(`settings.connection_detail_${state}`);
        });
      };
      Homey.get('bridge_ip', (err, value) => { if (!err && value) ip.value = value; });
      connect.addEventListener('click', () => {
        const address = ip.value.trim();
        if (!address) {
          status.textContent = Homey.__('settings.enter_ip');
          return;
        }
        if (connecting) return;
        cancelled = false;
        connecting = true;
        connect.disabled = true;
        linkStep.hidden = false;
        status.textContent = Homey.__('settings.waiting_for_link');
        const pollForLink = () => {
          if (cancelled) return;
          Homey.api('POST', '/create-key', { ip: address }, (error, result) => {
            if (cancelled) return;
            if (!error && result && result.ok) {
              status.textContent = Homey.__('settings.connected');
              linkStep.hidden = true;
              connecting = false;
              connect.disabled = false;
              return;
            }
            if (!error && result && result.code === 'link_button_not_pressed') {
              status.textContent = Homey.__('settings.waiting_for_link');
              window.setTimeout(pollForLink, 1200);
              return;
            }
            const messages = {
              invalid_ip: 'settings.invalid_ip',
              bridge_timeout: 'settings.bridge_timeout',
              bridge_unreachable: 'settings.bridge_unreachable',
              bridge_rejected_request: 'settings.bridge_rejected',
            };
            status.textContent = Homey.__(messages[(result && result.code) || (error && error.message)] || 'settings.bridge_unreachable');
            connecting = false;
            connect.disabled = false;
            linkStep.hidden = true;
        });
        };
        pollForLink();
      });
      cancelLink.addEventListener('click', () => {
        cancelled = true;
        connecting = false;
        connect.disabled = false;
        linkStep.hidden = true;
        status.textContent = Homey.__('settings.cancelled');
      });
      diagnose.addEventListener('click', () => {
        diagnose.disabled = true;
        diagnosisResult.hidden = false;
        diagnosisResult.textContent = Homey.__('settings.diagnosing');
        Homey.api('POST', '/diagnose-discovery', {}, (error, result) => {
          diagnose.disabled = false;
          if (error || !result) {
            diagnosisResult.textContent = Homey.__('settings.diagnosis_failed');
            return;
          }
          if (!result.ok) {
            diagnosisResult.textContent = Homey.__(result.status === 'not_configured' ? 'settings.connection_detail_not_configured' : 'settings.diagnosis_failed');
            return;
          }
          const discovery = result.discovery || {};
          const lines = [
            `${Homey.__('settings.diagnosis_found')}: ${result.foundCount || 0}`,
            `${Homey.__('settings.diagnosis_resources')}: ${discovery.deviceCount || 0} / ${discovery.buttonCount || 0} / ${discovery.rotaryCount || 0}`,
          ];
          if (discovery.candidates && discovery.candidates.length) {
            lines.push(`${Homey.__('settings.diagnosis_candidates')}:`);
            discovery.candidates.forEach(candidate => lines.push(`• ${candidate.name} (${candidate.model}) — ${candidate.buttonCount} ${Homey.__('settings.diagnosis_buttons')}, ${candidate.rotaryCount} ${Homey.__('settings.diagnosis_rotaries')}`));
          } else {
            lines.push(Homey.__('settings.diagnosis_none'));
          }
          if (discovery.errors && discovery.errors.length) lines.push(`${Homey.__('settings.diagnosis_errors')}: ${discovery.errors.join('; ')}`);
          if (result.error) lines.push(`${Homey.__('settings.diagnosis_errors')}: ${result.error}`);
          diagnosisResult.textContent = lines.join('\n');
        });
      });
      Homey.ready();
      refreshConnectionStatus();
      window.setInterval(refreshConnectionStatus, 4000);
    }
  </script>
</body>
</html>
